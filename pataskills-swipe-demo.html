<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PataSkills — Swipe Card Demo</title>
<style>
  :root{
    --grad-a:#22c1a0;
    --grad-b:#8fe3a8;
    --bg:#0c0c10;
    --card-bg:#ffffff;
    --dim:#8a8a92;
    --wrong:#ff5b6e;
    --right:#3ddc84;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px 0;
    color:#fff;
  }

  .phone{
    width:100%;
    max-width:380px;
    height:720px;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:6px 4px 18px;
  }
  .icon-btn{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:#fff; opacity:.85; cursor:pointer; flex:0 0 auto;
    font-size:18px;
  }
  .segments{
    flex:1;
    display:flex;
    gap:6px;
  }
  .segment{
    flex:1;
    height:6px;
    border-radius:4px;
    background:#2a2a30;
    overflow:hidden;
  }
  .segment.done .fill{width:100%;}
  .segment .fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    border-radius:4px;
    transition:width .35s ease;
  }
  .bolt{color:#f5c542; font-size:18px;}

  /* stack */
  .stack{
    position:relative;
    flex:1;
    margin-top:6px;
  }
  .card{
    position:absolute;
    inset:0;
    background:var(--card-bg);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    color:#111;
    will-change:transform,opacity;
    touch-action:none;
  }
  .card-head{
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    padding:34px 22px 22px;
    text-align:center;
    font-size:20px;
    font-weight:800;
    line-height:1.35;
    color:#0b3b31;
  }
  .card-body{
    flex:1;
    padding:22px;
    display:flex;
    flex-direction:column;
  }
  .options{
    display:flex;
    gap:14px;
    flex:1;
  }
  .option{
    flex:1;
    border:2px solid #e3e3e8;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 8px;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    background:#fafafa;
  }
  .option:active{transform:scale(.97);}
  .option .emoji{font-size:54px;}
  .option .label{
    font-weight:800;
    font-size:15px;
    letter-spacing:.5px;
    color:#333;
  }
  .option.selected{
    border-color:#2dd4bf;
    background:#e8fbf7;
  }
  .option.mark-right{
    border-color:var(--right);
    background:#e5fbef;
  }
  .option.mark-wrong{
    border-color:var(--wrong);
    background:#ffeced;
  }
  .letter{
    width:26px;height:26px;
    border-radius:50%;
    background:#eee;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:800; color:#555;
    margin-bottom:2px;
  }

  .stamp{
    position:absolute;
    top:26px;
    font-weight:900;
    font-size:26px;
    letter-spacing:2px;
    border:4px solid;
    border-radius:10px;
    padding:4px 12px;
    transform:rotate(-18deg);
    opacity:0;
    pointer-events:none;
    transition:opacity .12s;
  }
  .stamp.left{left:20px; border-color:var(--wrong); color:var(--wrong); transform:rotate(-18deg);}
  .stamp.right{right:20px; border-color:var(--right); color:var(--right); transform:rotate(18deg);}

  /* bottom */
  .bottom{
    padding:16px 4px 4px;
  }
  .check-btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:16px;
    background:#2a2a30;
    color:#6b6b74;
    font-size:16px;
    font-weight:700;
    cursor:not-allowed;
    transition:background .15s, color .15s;
  }
  .check-btn.active{
    background:#fff;
    color:#111;
    cursor:pointer;
  }
  .hint{
    text-align:center;
    color:var(--dim);
    font-size:12px;
    margin-top:10px;
  }

  .done-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .done-screen.show{opacity:1; pointer-events:auto;}
  .done-screen .big{font-size:52px;}
  .done-screen h2{margin:0; font-size:22px;}
  .done-screen p{margin:0; color:var(--dim); font-size:14px;}
  .restart{
    margin-top:14px;
    padding:12px 22px;
    border-radius:14px;
    border:none;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    color:#0b3b31;
    font-weight:800;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <div class="icon-btn">✕</div>
    <div class="segments" id="segments"></div>
    <div class="bolt">⚡</div>
  </div>

  <div class="stack" id="stack">
    <div class="done-screen" id="doneScreen">
      <div class="big">🎉</div>
      <h2>All caught up!</h2>
      <p>You've mastered every pet card.</p>
      <button class="restart" id="restartBtn">Play again</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  { q: "Which pet is famous for barking?", a: {emoji:"🐱", label:"Cat"}, b: {emoji:"🐶", label:"Dog"}, correct:"b" },
  { q: "Which farm animal says \"Moo\"?", a: {emoji:"🐄", label:"Cow"}, b: {emoji:"🐑", label:"Sheep"}, correct:"a" },
  { q: "Which pet loves chasing its own tail?", a: {emoji:"🐕", label:"Dog"}, b: {emoji:"🐟", label:"Fish"}, correct:"a" },
  { q: "Which pet is famous for saying \"Tweet tweet\"?", a: {emoji:"🦜", label:"Parrot"}, b: {emoji:"🐢", label:"Turtle"}, correct:"a" },
  { q: "Which animal purrs when it's happy?", a: {emoji:"🐰", label:"Rabbit"}, b: {emoji:"🐱", label:"Cat"}, correct:"b" },
  { q: "Which pet is best known for hopping around?", a: {emoji:"🐹", label:"Hamster"}, b: {emoji:"🐰", label:"Rabbit"}, correct:"b" },
];

let queue = QUESTIONS.map((q, i) => ({ ...q, id: i }));
let masteredIds = new Set();
const totalUnique = QUESTIONS.length;

const stackEl = document.getElementById("stack");
const segmentsEl = document.getElementById("segments");
const doneScreen = document.getElementById("doneScreen");

function buildSegments() {
  segmentsEl.innerHTML = "";
  for (let i = 0; i < totalUnique; i++) {
    const seg = document.createElement("div");
    seg.className = "segment";
    seg.innerHTML = '<div class="fill"></div>';
    segmentsEl.appendChild(seg);
  }
}

function updateSegments() {
  const fills = segmentsEl.querySelectorAll(".fill");
  fills.forEach((f, i) => {
    f.style.width = i < masteredIds.size ? "100%" : "0%";
  });
}

let cardEls = []; // top of array = front card element

function render(withEntrance) {
  // clear existing card elements (keep doneScreen)
  cardEls.forEach(el => el.remove());
  cardEls = [];

  if (queue.length === 0) {
    doneScreen.classList.add("show");
    updateSegments();
    return;
  }
  doneScreen.classList.remove("show");

  const visible = queue.slice(0, 3); // front + up to 2 behind
  // build back-to-front so front card is last child (on top)
  for (let i = visible.length - 1; i >= 0; i--) {
    const item = visible[i];
    const el = buildCard(item, i === 0);
    stackEl.insertBefore(el, doneScreen);
    setRestingTransform(el, i, i === 0 && withEntrance);
    cardEls.push(el);
  }
  cardEls.reverse(); // now index 0 = front
}

function setRestingTransform(el, depth, animateIn) {
  const scale = 1 - depth * 0.045;
  const y = depth * 12;
  if (animateIn) {
    el.style.transition = "none";
    el.style.transform = `translate(0px, ${y + 40}px) scale(${scale - 0.06}) rotate(0deg)`;
    el.style.opacity = "0.4";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.transition = "transform .38s cubic-bezier(.2,.9,.3,1.3), opacity .25s ease";
        el.style.transform = `translate(0px, ${y}px) scale(${scale}) rotate(0deg)`;
        el.style.opacity = "1";
      });
    });
  } else {
    el.style.transition = depth === 0 ? "none" : "transform .3s ease";
    el.style.transform = `translate(0px, ${y}px) scale(${scale}) rotate(0deg)`;
    el.style.opacity = "1";
  }
  el.style.zIndex = 10 - depth;
}

function buildCard(item, isFront) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="card-head">${item.q}</div>
    <div class="card-body">
      <div class="options">
        <div class="option" data-choice="a">
          <div class="letter">A</div>
          <div class="emoji">${item.a.emoji}</div>
          <div class="label">${item.a.label}</div>
        </div>
        <div class="option" data-choice="b">
          <div class="letter">B</div>
          <div class="emoji">${item.b.emoji}</div>
          <div class="label">${item.b.label}</div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <button class="check-btn" disabled>Check</button>
      <div class="hint">Drag the card, or pick an answer and hit Check</div>
    </div>
    <div class="stamp left">WRONG</div>
    <div class="stamp right">RIGHT</div>
  `;

  if (!isFront) return el;

  let selected = null;
  const optionEls = el.querySelectorAll(".option");
  const checkBtn = el.querySelector(".check-btn");
  const stampLeft = el.querySelector(".stamp.left");
  const stampRight = el.querySelector(".stamp.right");

  optionEls.forEach(opt => {
    opt.addEventListener("click", () => {
      if (el.classList.contains("resolving")) return;
      selected = opt.dataset.choice;
      optionEls.forEach(o => o.classList.remove("selected"));
      opt.classList.add("selected");
      checkBtn.disabled = false;
      checkBtn.classList.add("active");
    });
  });

  checkBtn.addEventListener("click", () => {
    if (!selected || el.classList.contains("resolving")) return;
    const isCorrect = selected === item.correct;
    optionEls.forEach(o => {
      if (o.dataset.choice === item.correct) o.classList.add("mark-right");
      else if (o.dataset.choice === selected) o.classList.add("mark-wrong");
    });
    setTimeout(() => resolveCard(el, item, isCorrect ? "right" : "left"), 350);
  });

  // drag to swipe
  let dragging = false, startX = 0, startY = 0, dx = 0, dy = 0;

  el.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".option") || e.target.closest(".check-btn")) return;
    if (el.classList.contains("resolving")) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    el.setPointerCapture(e.pointerId);
    el.style.transition = "none";
  });

  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;
    const rot = dx / 18;
    el.style.transform = `translate(${dx}px, ${dy * 0.4}px) rotate(${rot}deg)`;
    const progress = Math.min(Math.abs(dx) / 120, 1);
    if (dx > 0) { stampRight.style.opacity = progress; stampLeft.style.opacity = 0; }
    else { stampLeft.style.opacity = progress; stampRight.style.opacity = 0; }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    el.style.transition = "transform .25s ease, opacity .25s ease";
    const threshold = 110;
    if (dx > threshold) {
      const isCorrect = selected === item.correct || selected === null ? (selected ? selected === item.correct : true) : false;
      resolveCard(el, item, "right");
    } else if (dx < -threshold) {
      resolveCard(el, item, "left");
    } else {
      el.style.transform = "translate(0px,0px) rotate(0deg)";
      stampLeft.style.opacity = 0;
      stampRight.style.opacity = 0;
    }
    dx = 0; dy = 0;
  }

  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);

  return el;
}

function resolveCard(el, item, direction) {
  if (el.classList.contains("resolving")) return;
  el.classList.add("resolving");

  const goingRight = direction === "right";
  el.style.transition = "transform .38s cubic-bezier(.3,.6,.4,1), opacity .3s ease";
  el.style.transform = goingRight
    ? "translate(520px, -60px) rotate(24deg)"
    : "translate(-520px, -60px) rotate(-24deg)";
  el.style.opacity = "0";

  setTimeout(() => {
    // remove from queue
    queue = queue.filter(q => q !== item);
    if (goingRight) {
      masteredIds.add(item.id);
    } else {
      queue.push(item); // send to back of stack
    }
    render(true);
  }, 380);
}

document.getElementById("restartBtn").addEventListener("click", () => {
  queue = QUESTIONS.map((q, i) => ({ ...q, id: i }));
  masteredIds = new Set();
  buildSegments();
  render(true);
});

buildSegments();
render(false);
</script>
</body>
</html>
